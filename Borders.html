<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Borders</title>
    <style>
      h1 {
        border: 3px solid blue;
        border-radius: 30px;
        text-align: center;
        font-size: 100px;
      }

      .Profile {
        border: 3px solid green;
        border-radius: 30px;
        padding: 5px;
        font-size: 30px;
      }

      h2 {
        text-align: center;
        border: 2px dotted purple;
        border-radius: 30px;
        font-size: 50px;
      }

      .Skills {
        border: 3px dashed red;
        border-radius: 30px;
        padding: 5px;
        font-size: 30px;
      }
    </style>
  </head>
  <body>
    <h1>Profile Details</h1>
    <div class="Profile">
      <ul>
        <li>Charishma Reddy</li>
        <li>B.Tech – 1st Year</li>
        <li>Student & Future Innovator</li>
      </ul>
    </div>
    <h2>Skills</h2>
    <div class="Skills">
      <ul>
        <li>HTML, CSS, Python</li>
        <li>Technology & Web Development</li>
        <li>Music & Creative Activities</li>
      </ul>
    </div>
  </body>
</html>
