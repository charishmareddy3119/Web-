<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Borders</title>
    <style>
      h1 {
        color: rgb(214, 6, 86);
        text-align: center;
        font-size: 100px;
      }

      p {
        color: rgb(243, 114, 191);
        font-size: 30px;
        line-height: 1.5;
      }

      .box1 {
        border: 3px dashed rgb(161, 4, 85);
        border-radius: 15px;
      }

      .box2 {
        border: 3px dotted rgb(161, 4, 85);
        border-radius: 15px;
      }

      .box3 {
        border: 3px double rgb(161, 4, 85);
        border-radius: 15px;
      }

      .box4 {
        border: 3px solid rgb(161, 4, 85);
        border-radius: 15px;
      }
    </style>
  </head>
  <body>
    <h1>CSS Borders</h1>

    <p><i>This paragraph has a solid border.</i></p>

    <p class="box1">This is a dashed border.</p>

    <p class="box2">This is a dotted border.</p>

    <p class="box3">This is a double border.</p>

    <p class="box4">This is a rounded border</p>
  </body>
</html>
